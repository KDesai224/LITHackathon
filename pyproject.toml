[project]
name="LITHackathon"
version="0.1"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "hypothesis>=6.167.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "sentence-transformers>=6.0.1",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=sct_intake --cov-report=term-missing"
