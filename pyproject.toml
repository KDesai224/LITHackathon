[project]
name = "LITHackathon"
version = "0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.29.0",
    "pydantic>=2.9.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidocr>=3.9.2",
    "reportlab>=4.0",
    "requests>=2.34.2",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "httpx>=0.28.1",
    "hypothesis>=6.167.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "sentence-transformers>=6.0.1",
    "ty>=0.0.78",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: embedding model integration tests (load sentence-transformers / download weights on first use)",
]
addopts = "--cov=sct_intake --cov-report=term-missing -m 'not slow'"
