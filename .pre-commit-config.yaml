repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty type check
        entry: uv run ty check --no-progress
        language: system
        types: [python]
        pass_filenames: false
