name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Cache the Hugging Face model hub so BAAI/bge-small-en-v1.5 downloads
      # once per runner and is reused on every subsequent run. The model itself
      # is never committed to the repository.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-bge-small-en-v1.5-${{ runner.os }}
          restore-keys: |
            hf-bge-small-en-v1.5-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest
