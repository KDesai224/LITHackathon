name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Cache the Hugging Face model hub so BAAI/bge-small-en-v1.5 downloads
      # once per runner and is reused on every subsequent run. The model itself
      # is never committed to the repository.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-bge-small-en-v1.5-${{ runner.os }}
          restore-keys: |
            hf-bge-small-en-v1.5-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests (fast)
        run: uv run pytest

      # Embedding model tests load BAAI/bge-small-en-v1.5; run only on push.
      - name: Run embedding model tests (slow)
        if: github.event_name == 'push'
        run: uv run pytest -m slow

      # basedpyright is the project's conservative type checker; it runs here on
      # every push (and pull request) instead of in the local pre-commit hook,
      # which uses the faster `ty` checker.
      - name: Type check (basedpyright)
        run: uv run basedpyright
